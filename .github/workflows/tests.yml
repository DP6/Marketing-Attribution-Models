name: Tests
on:
  pull_request:
    branches: [staging, master]
  push:
    branches: [staging]
jobs:
  tests:
    # Python 3.8 has no build for ubuntu-latest (26.04); pin it to 24.04.
    runs-on: ${{ matrix.python-version == '3.8' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest